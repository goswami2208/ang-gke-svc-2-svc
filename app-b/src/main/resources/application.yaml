server:
  port: 8081

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com

app:
  security:
    expected-audience: http://app-b-svc.default.svc.cluster.local:8081
    allowed-caller-sa: app-a-gsa@my-cloudbuild-project-434009.iam.gserviceaccount.com

management:
  endpoint:
    health:
      probes:
        enabled: true